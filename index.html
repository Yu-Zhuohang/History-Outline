<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研政治·史纲核心事件时间线</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app">
    <aside class="timeline-pane">
      <header class="pane-header">
        <h1>史纲核心事件</h1>
        <p class="subtitle" id="event-meta">按年份排序 · 共 31 个节点</p>
      </header>

      <!-- 时间线由 js/app.js 读取 data/events.json 后数据驱动渲染 -->
      <div class="timeline" id="timeline" role="list" aria-label="史纲核心事件时间线"></div>

      <noscript>
        <p class="fallback-text">本页的时间线依赖 JavaScript 渲染，请启用 JavaScript 后刷新。</p>
      </noscript>
    </aside>

    <main class="content-pane">
      <div id="map"></div>
      <div id="detail-panel">
        <p class="placeholder-text" id="panel-hint">点击左侧时间线节点，查看该事件的考点讲解。</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* 主 CDN 不可用时换备用源（同步写入，保证后续脚本拿到 window.L） */
    if (!window.L) {
      document.write('<script src="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.js"><\/script>');
    }
  </script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
